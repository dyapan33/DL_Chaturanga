<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Valex Chess</title>
    <link rel="stylesheet" href="CSS/Style.css">
    <link rel="stylesheet" href="CSS/Index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/peerjs@latest/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="AppShell">
        <button id="MobileMenuButton" class="MobileMenuButton" type="button" aria-label="Open menu">
            <i data-lucide="menu"></i>
        </button>
        <div id="SidebarBackdrop" class="SidebarBackdrop"></div>

        <aside id="AppSidebar" class="AppSidebar">
            <div class="SidebarHeader">
                <h1 id="SidebarLogo" class="SidebarLogo">Valex Chess</h1>
                <div class="SidebarToolbar">
                    <button id="SidebarCloseButton" class="SidebarIconButton" type="button" title="Close sidebar" aria-label="Close sidebar">
                        <i data-lucide="panel-left-close"></i>
                    </button>
                    <button id="SidebarAudioButton" class="SidebarIconButton" type="button" title="Toggle sound" aria-label="Toggle sound">
                        <i data-lucide="volume-2"></i>
                    </button>
                    <button id="SidebarFilterButton" class="SidebarIconButton" type="button" title="Filter games (All)" aria-label="Filter games">
                        <i data-lucide="filter"></i>
                    </button>
                </div>
            </div>
            <div class="SidebarDivider"></div>
            <button id="SidebarHomeButton" class="SecondaryButton SidebarActionBtn" type="button">
                <span class="SidebarActionInner">
                    <i data-lucide="home"></i>
                    <span>Home</span>
                </span>
            </button>
            <div class="SidebarDivider"></div>
            <div class="SidebarPuzzleGroup">
                <button id="SidebarDailyPuzzleButton" class="SecondaryButton SidebarActionBtn" type="button">
                    <span class="SidebarActionInner">
                        <i data-lucide="sparkles"></i>
                        <span>Daily Puzzle</span>
                    </span>
                </button>
                <button id="SidebarRandomPuzzleButton" class="SecondaryButton SidebarActionBtn" type="button">
                    <span class="SidebarActionInner">
                        <i data-lucide="puzzle"></i>
                        <span>Random Puzzle</span>
                    </span>
                </button>
            </div>
            <div class="SidebarDivider"></div>
            <div class="SidebarGamesHeader">
                <span id="SidebarGamesLabel" class="SidebarSectionLabel">Your Games</span>
            </div>
            <div id="SavedGamesList" class="SavedGamesList"></div>
        </aside>

        <main id="WorkspaceLayout" class="Layout PreGameLayout">
            <section id="BoardColumn" class="BoardColumn Hidden">
                <div id="BoardPanel"></div>
                <div id="PromotionPanel" class="Hidden"></div>
                <div id="DrawOfferPanel" class="Hidden"></div>
            </section>

            <aside id="SideColumn" class="SideColumn">
                <div id="BotSelector"></div>
                <div id="PuzzlePanel" class="Hidden"></div>
                <div id="SandboxPanel" class="Hidden"></div>
                <div id="MoveList" class="Hidden"></div>
                <div id="GameControls" class="Controls Hidden">
                    <button id="UndoButton" class="PrimaryButton" type="button">
                        <i data-lucide="rotate-ccw"></i>
                        <span id="UndoButtonText">Undo</span>
                    </button>
                    <button id="DrawButton" class="SecondaryButton" type="button">
                        <i data-lucide="handshake"></i>
                        <span id="DrawButtonText">Draw Request</span>
                    </button>
                    <button id="ResignButton" class="DangerButton" type="button">
                        <i data-lucide="flag"></i>
                        <span>Resign</span>
                    </button>
                </div>
                <div id="PostGameControls" class="Controls Hidden">
                    <button id="RematchButton" class="SecondaryButton Hidden" type="button">
                        <i data-lucide="repeat"></i>
                        <span>Rematch</span>
                    </button>
                    <button id="NewGameButton" class="PrimaryButton" type="button">
                        <i data-lucide="refresh-cw"></i>
                        <span>New Game</span>
                    </button>
                </div>
                <div id="StatusPanel" class="Hidden"></div>
                <div id="OpponentBanner" class="Hidden"></div>
            </aside>
        </main>
    </div>

    <!-- Made by D Letten -->

    <script src="JS/ChessGame.js"></script>
    <script src="JS/ChessBot.js"></script>
    <script src="JS/Multiplayer.js"></script>
    <script src="JS/PublicLobby.js"></script>
    <script src="JS/Physics.js"></script>
    <script src="JS/Feedback.js"></script>
    <script src="JS/Puzzles.js"></script>
    <script src="JS/GameStore.js"></script>
    <script src="JS/Board.js"></script>
    <script src="JS/BotSelector.js"></script>
    <script src="JS/MoveList.js"></script>
    <script src="JS/Status.js"></script>
    <script src="JS/Main.js"></script>
</body>
</html>
